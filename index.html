<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SK Mess Manager Pro</title>
<meta name="theme-color" content="#1e3a8a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SK Mess Pro">
<style>
:root{--bg:#f3f5f9;--card:#fff;--text:#172033;--muted:#667085;--line:#e3e7ef;--brand:#1e40af;--brand-soft:#dfe8fb;
  --in:#15803d;--in-soft:#dcf3e3;--out:#c2410c;--out-soft:#fbe5da;--shadow:0 1px 3px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1320;--card:#161d2d;--text:#e6ebf5;--muted:#93a0b8;--line:#253048;--brand:#7aa2f7;--brand-soft:#1d2a4a;
  --in:#4ade80;--in-soft:#14301f;--out:#fb923c;--out-soft:#3a2216;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#1e3a8a;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.hrow{display:flex;align-items:center;gap:8px}
header h1{font-size:18px;margin:0;flex:1}
.pro{display:inline-block;vertical-align:middle;margin-left:6px;padding:2px 8px;border-radius:999px;background:linear-gradient(180deg,#fcd34d,#f59e0b);color:#78350f;font-size:11px;font-weight:800;letter-spacing:.06em;box-shadow:0 1px 2px rgba(0,0,0,.2);position:relative;top:-2px}
header button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:15px}
.month{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px}
.month b{min-width:130px;text-align:center;font-size:16px}
main{padding:14px 14px calc(92px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:9px 2px 8px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button span.i{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--brand);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.stat .l{font-size:11.5px;color:var(--muted)}.stat .v{font-size:clamp(13px,3.8vw,17px);font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border:0}
.hero .l{color:#dbe6ff}
.in{color:var(--in)}.out{color:var(--out)}.muted{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;border:1px solid var(--line);margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font-weight:600;color:var(--muted);font-size:14px}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
.list .item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;background:var(--brand-soft);color:var(--brand);font-size:14px}
.item .main{flex:1;min-width:0}.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap}
.btn{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;background:var(--brand);color:#fff;width:100%}
.btn.sec{background:var(--brand-soft);color:var(--brand)}.btn.red{background:var(--out-soft);color:var(--out)}.btn.wa{background:#25d366;color:#fff}
.mini{border:0;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;background:var(--brand-soft);color:var(--brand)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:30px;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:6}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{color:var(--muted);font-weight:600;font-size:12px}
tr.click{cursor:pointer}
.tw{overflow-x:auto;margin:0 -4px}
.meal{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.step{display:flex;align-items:center;gap:6px}
.step button{width:38px;height:38px;border-radius:10px;border:0;background:var(--brand-soft);color:var(--brand);font-size:22px;font-weight:700}
.step b{min-width:26px;text-align:center;font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:680px;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 10px;font-size:18px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:14px}
.checks input{width:auto;margin:0}
.cust .r{display:flex;align-items:center;gap:8px;margin:6px 0}.cust .r span{flex:1}.cust input{width:110px;padding:8px}
.actions{display:flex;gap:8px;margin-top:16px}
.lock{position:fixed;inset:0;z-index:40;background:#1e3a8a;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom));text-align:center;overflow:auto}
.lock.show{display:flex}
.lock h2{margin:8px 0 4px;font-size:20px}.lock p{margin:4px 0 0;opacity:.85;font-size:14px;max-width:320px}
.lock .logo{font-size:40px}
.dots{display:flex;gap:16px;margin:26px 0 8px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #fff}.dots i.f{background:#fff}
.dots.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.lerr{min-height:20px;font-size:14px;color:#ffe4c4}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;margin-top:10px}
.pad button{width:72px;height:72px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:28px;font-weight:500}
.pad button:active{background:rgba(255,255,255,.35)}.pad button.ghost{background:none;font-size:15px}
.llink{background:none;border:0;color:#fff;text-decoration:underline;font-size:15px;margin-top:18px;padding:8px}
.lock .box{width:100%;max-width:340px;text-align:left;margin-top:18px}
.lock .box label{display:block;font-size:13px;margin:10px 0 4px;opacity:.9}
.lock .box select,.lock .box input{background:#fff;color:#16211f;border:0}
.lock .box .btn{background:#fff;color:#1e3a8a;margin-top:16px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;display:none}
.bal{font-weight:800}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.kv:last-child{border-bottom:0}
.total{font-size:16px;font-weight:800}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1>SK Mess Manager <span class="pro">PRO</span></h1><button id="setBtn" aria-label="Settings">⚙︎</button></div>
  <div class="month"><button id="mPrev" aria-label="Previous month">‹</button><b id="mName"></b><button id="mNext" aria-label="Next month">›</button></div>
</header>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Add">+</button>
<nav class="tabs">
  <button data-tab="sum" class="on"><span class="i">📊</span>Summary</button>
  <button data-tab="meal"><span class="i">🍛</span>Meals</button>
  <button data-tab="exp"><span class="i">🧾</span>Expenses</button>
  <button data-tab="dep"><span class="i">💵</span>Deposits</button>
  <button data-tab="mem"><span class="i">👥</span>Members</button>
</nav>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="lock" id="lock"></div>
<div class="toast" id="toast"></div>
<script>
/* ===== state ===== */
const KEY="skmess_v1";
const CURS={AED:"AED ",INR:"₹",BDT:"৳"};
const BILLS=["Room rent","DEWA (electricity)","Water","Gas","Internet","Cleaning","Other"];
let S=(()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.members)return d}catch(e){}return{cur:"AED",members:[],months:{}}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Could not save")}}
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r2=n=>Math.round(n*100)/100;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmt=n=>(n<-0.004?"-":"")+CURS[S.cur]+Math.abs(r2(n)).toLocaleString("en-US",{maximumFractionDigits:2});
const fmtN=n=>r2(n).toLocaleString("en-US",{maximumFractionDigits:2});
const todayStr=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const mKey=d=>d.slice(0,7);
const mLabel=k=>new Date(k+"-01T00:00").toLocaleDateString("en-GB",{month:"long",year:"numeric"});
const dLabel=d=>new Date(d+"T00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const shiftM=(k,n)=>{const d=new Date(k+"-01T00:00");d.setMonth(d.getMonth()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const mem=id=>S.members.find(m=>m.id===id);
const mname=id=>mem(id)?.name||"—";
const initials=n=>n.split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();
let V={tab:"sum",month:S.sel||mKey(todayStr()),expTab:"bazar",mealDate:todayStr()};

function M(k=V.month){
  if(!S.months[k]){
    const prev=S.months[shiftM(k,-1)];
    const m={mem:S.members.filter(x=>x.active!==false).map(x=>x.id),opening:{},deposits:[],bazar:[],bills:[],meals:{}};
    if(prev){const c=calc(prev);c.rows.forEach(r=>{if(Math.abs(r.bal)>0.004)m.opening[r.id]=r2(r.bal)})}
    S.months[k]=m;save();
  }
  return S.months[k];
}

/* ===== calculation ===== */
function calc(m){
  const ids=new Set(m.mem);
  m.deposits.forEach(x=>ids.add(x.mid));m.bazar.forEach(x=>x.by!=="fund"&&ids.add(x.by));
  m.bills.forEach(b=>{b.by!=="fund"&&ids.add(b.by);Object.keys(b.shares||{}).forEach(i=>ids.add(i));(b.among||[]).forEach(i=>ids.add(i))});
  Object.values(m.meals).forEach(d=>Object.keys(d).forEach(i=>ids.add(i)));
  Object.keys(m.opening).forEach(i=>ids.add(i));
  const R={};[...ids].forEach(id=>R[id]={id,meals:0,dep:0,bazarPaid:0,billPaid:0,billShare:0,open:m.opening[id]||0});
  Object.values(m.meals).forEach(d=>Object.entries(d).forEach(([i,n])=>R[i].meals+=n));
  let dep=0,bazar=0,fundBazar=0,bills=0,fundBills=0;
  m.deposits.forEach(x=>{R[x.mid].dep+=x.amount;dep+=x.amount});
  m.bazar.forEach(x=>{bazar+=x.amount;if(x.by==="fund")fundBazar+=x.amount;else R[x.by].bazarPaid+=x.amount});
  m.bills.forEach(b=>{bills+=b.amount;if(b.by==="fund")fundBills+=b.amount;else R[b.by].billPaid+=b.amount;
    billShares(b).forEach(([i,v])=>R[i].billShare+=v)});
  const meals=Object.values(R).reduce((s,r)=>s+r.meals,0);
  const rate=meals?bazar/meals:0;
  const rows=Object.values(R).map(r=>{r.mealCost=r.meals*rate;r.cost=r.mealCost+r.billShare;r.paid=r.open+r.dep+r.bazarPaid+r.billPaid;r.bal=r.paid-r.cost;return r})
    .sort((a,b)=>mname(a.id).localeCompare(mname(b.id)));
  const opening=rows.reduce((s,r)=>s+r.open,0);
  return{rows,dep,bazar,fundBazar,bills,fundBills,meals,rate,cash:opening+dep-fundBazar-fundBills,cost:bazar+bills};
}
function billShares(b){
  if(b.mode==="custom")return Object.entries(b.shares||{}).filter(([,v])=>v>0);
  const a=b.among||[];return a.length?a.map(i=>[i,b.amount/a.length]):[];
}

/* ===== render ===== */
const app=$("#app");
function render(){
  S.sel=V.month;M();
  $("#mName").textContent=mLabel(V.month);
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===V.tab));
  $("#fab").style.display=(V.tab==="sum"||V.tab==="meal")?"none":"";
  ({sum:rSum,meal:rMeal,exp:rExp,dep:rDep,mem:rMem})[V.tab]();
}
function needMembers(){return S.members.length?"":`<div class="card empty">No members yet.<br><br><button class="mini" onclick="V.tab='mem';render();memberForm()">＋ Add members first</button></div>`}

function rSum(){
  const m=M(),c=calc(m);
  if(!S.members.length){app.innerHTML=needMembers();return}
  let h=`<div class="stats">
   <div class="stat hero" style="grid-column:span 3"><div class="row between"><div><div class="l">Meal rate</div><div class="v" style="font-size:26px">${fmt(c.rate)}</div></div>
   <div style="text-align:right"><div class="l">Total meals</div><div class="v">${fmtN(c.meals)}</div></div></div></div>
   <div class="stat"><div class="l">Total deposit</div><div class="v in">${fmt(c.dep)}</div></div>
   <div class="stat"><div class="l">Bazar</div><div class="v out">${fmt(c.bazar)}</div></div>
   <div class="stat"><div class="l">Bills</div><div class="v out">${fmt(c.bills)}</div></div>
   <div class="stat"><div class="l">Total cost</div><div class="v">${fmt(c.cost)}</div></div>
   <div class="stat"><div class="l">Members</div><div class="v">${c.rows.length}</div></div>
   <div class="stat"><div class="l">Cash in hand</div><div class="v ${c.cash<0?"out":""}">${fmt(c.cash)}</div></div></div>`;
  h+=`<div class="card"><div class="row between" style="margin-bottom:6px"><b>Member balance</b><span class="muted">tap a name for details</span></div><div class="tw"><table>
   <tr><th>Name</th><th>Meals</th><th>Cost</th><th>Paid</th><th>Balance</th></tr>
   ${c.rows.map(r=>`<tr class="click" data-st="${r.id}"><td><b>${esc(mname(r.id))}</b></td><td>${fmtN(r.meals)}</td><td>${fmtN(r.cost)}</td><td>${fmtN(r.paid)}</td>
   <td class="bal ${r.bal<-0.004?"out":"in"}">${r.bal<-0.004?"−"+fmtN(-r.bal):"+"+fmtN(r.bal)}</td></tr>`).join("")}</table></div>
   <p class="muted" style="margin:8px 0 0"><span class="in">+ green</span> = will get back · <span class="out">− red</span> = must pay</p></div>`;
  const due=c.rows.filter(r=>r.bal<-0.004),back=c.rows.filter(r=>r.bal>0.004);
  h+=`<div class="card"><b>Settlement</b>
   <div class="kv"><span>To collect from ${due.length} member(s)</span><b class="out">${fmt(-due.reduce((s,r)=>s+r.bal,0))}</b></div>
   <div class="kv"><span>To give back to ${back.length} member(s)</span><b class="in">${fmt(back.reduce((s,r)=>s+r.bal,0))}</b></div></div>
   <button class="btn wa" id="shareAll">Share summary on WhatsApp</button>`;
  app.innerHTML=h;
  $("#shareAll").onclick=()=>share(summaryText(),"");
}

function rMeal(){
  if(!S.members.length){app.innerHTML=needMembers();return}
  const m=M();if(mKey(V.mealDate)!==V.month)V.mealDate=V.month===mKey(todayStr())?todayStr():V.month+"-01";
  const day=m.meals[V.mealDate]||{};const ids=m.mem;
  const tot=ids.reduce((s,i)=>s+(day[i]||0),0);const c=calc(m);
  app.innerHTML=`<div class="card"><div class="row between"><button class="mini" id="dPrev">‹</button>
    <input type="date" id="mDate" value="${V.mealDate}" style="width:auto;text-align:center"><button class="mini" id="dNext">›</button></div>
    <div class="row between" style="margin-top:10px"><span class="muted">Set everyone:</span><div class="chips">${[0,1,2,3].map(n=>`<button class="chip" data-all="${n}">${n}</button>`).join("")}</div></div></div>
  <div class="card"><div class="row between"><b>${dLabel(V.mealDate)}</b><span class="muted">Day total: <b>${fmtN(tot)}</b> · Month: <b>${fmtN(c.meals)}</b></span></div>
  ${ids.length?ids.map(i=>`<div class="meal"><div class="av">${esc(initials(mname(i)))}</div><div style="flex:1">${esc(mname(i))}</div>
    <div class="step"><button data-dec="${i}">−</button><b>${fmtN(day[i]||0)}</b><button data-inc="${i}">+</button></div></div>`).join(""):`<div class="empty">No members in this month.</div>`}</div>
  <p class="muted">Tip: tap a number to type any value (e.g. 1.5 for a half meal).</p>`;
  const setDay=(i,v)=>{const d=m.meals[V.mealDate]||(m.meals[V.mealDate]={});v=Math.max(0,r2(v));if(v)d[i]=v;else delete d[i];if(!Object.keys(d).length)delete m.meals[V.mealDate];save();rMeal()};
  app.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>setDay(b.dataset.inc,(day[b.dataset.inc]||0)+1));
  app.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>setDay(b.dataset.dec,(day[b.dataset.dec]||0)-1));
  app.querySelectorAll(".step b").forEach((b,k)=>b.onclick=()=>{const i=ids[k];const v=prompt(`Meals for ${mname(i)}`,day[i]||0);if(v!==null&&!isNaN(parseFloat(v)))setDay(i,parseFloat(v))});
  app.querySelectorAll("[data-all]").forEach(b=>b.onclick=()=>{const n=+b.dataset.all;const d={};if(n)ids.forEach(i=>d[i]=n);if(n)m.meals[V.mealDate]=d;else delete m.meals[V.mealDate];save();rMeal()});
  const go=n=>{const d=new Date(V.mealDate+"T00:00");d.setDate(d.getDate()+n);const s=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(mKey(s)!==V.month)V.month=mKey(s);V.mealDate=s;render()};
  $("#dPrev").onclick=()=>go(-1);$("#dNext").onclick=()=>go(1);
  $("#mDate").onchange=e=>{if(!e.target.value)return;V.mealDate=e.target.value;V.month=mKey(e.target.value);render()};
}

function rExp(){
  const m=M(),c=calc(m);
  let h=`<div class="seg">${[["bazar","🛒 Bazar"],["bills","🧾 Bills"]].map(([k,l])=>`<button class="${V.expTab===k?"on":""}" data-et="${k}">${l}</button>`).join("")}</div>`;
  if(V.expTab==="bazar"){
    h+=`<div class="stats"><div class="stat"><div class="l">Total bazar</div><div class="v out">${fmt(c.bazar)}</div></div>
      <div class="stat"><div class="l">Meals</div><div class="v">${fmtN(c.meals)}</div></div><div class="stat"><div class="l">Meal rate</div><div class="v">${fmt(c.rate)}</div></div></div>`;
    const L=[...m.bazar].sort((a,b)=>b.date.localeCompare(a.date));
    h+=L.length?`<div class="card list">${L.map(x=>`<div class="item" data-ebz="${x.id}"><div class="av">🛒</div><div class="main"><div class="t">${esc(x.note||"Bazar")}</div>

wrongAns:"Answer doesn't match",newPin:"Set a new PIN",tooMany:"Too many tries. Wait",sec:"sec",next:"Next",back:"Back",pinOk:"PIN saved",

/* ---------- PIN lock ---------- */
async function hash(txt,salt){const data=new TextEncoder().encode(salt+"|"+txt);
  if(crypto.subtle){const h=await crypto.subtle.digest("SHA-256",data);return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("")}
  let h=5381;for(const b of data)h=((h<<5)+h+b)|0;return"x"+(h>>>0).toString(16)}
const norm=a=>a.trim().toLowerCase().replace(/\s+/g," ");
const Lock={
  el:$("#lock"),pin:"",first:null,mode:"unlock",fails:0,until:0,hiddenAt:0,
  show(h){this.el.innerHTML=h;this.el.classList.add("show")},
  hide(){this.el.classList.remove("show");this.el.innerHTML=""},
  pad(title,sub,canCancel){this.pin="";
    this.show(`<div class="logo">🔒</div><h2>${title}</h2>${sub?`<p>${sub}</p>`:""}<div class="dots" id="dots">${"<i></i>".repeat(4)}</div><div class="lerr" id="lerr"></div>
    <div class="pad" id="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}
    <button class="ghost" data-k="x">${canCancel?t("cancel"):""}</button><button data-k="0">0</button><button class="ghost" data-k="b">⌫</button></div>
    ${this.mode==="unlock"?`<button class="llink" id="forgot">${t("forgot")}</button>`:""}`);
    $("#pad").onclick=e=>{const b=e.target.closest("button");if(b)this.key(b.dataset.k,canCancel)};
    const f=$("#forgot");if(f)f.onclick=()=>this.forgot()},
  dots(){document.querySelectorAll("#dots i").forEach((d,i)=>d.classList.toggle("f",i<this.pin.length))},
  err(m){const d=$("#dots");$("#lerr").textContent=m;d.classList.remove("shake");void d.offsetWidth;d.classList.add("shake");this.pin="";setTimeout(()=>this.dots(),350)},
  key(k,canCancel){
    if(k==="x"){if(canCancel)this.hide();return}
    if(k==="b"){this.pin=this.pin.slice(0,-1);return this.dots()}
    if(this.pin.length>=4)return;this.pin+=k;this.dots();
    if(this.pin.length===4)setTimeout(()=>this.done(canCancel),120)},
  async done(canCancel){
    if(this.mode==="unlock"){
      if(Date.now()<this.until)return this.err(`${t("tooMany")} ${Math.ceil((this.until-Date.now())/1000)} ${t("sec")}`);
      if(await hash(this.pin,S.sec.salt)===S.sec.pin){this.fails=0;this.hide();render()}
      else{this.fails++;if(this.fails>=5){this.until=Date.now()+30000;this.fails=0;this.err(`${t("tooMany")} 30 ${t("sec")}`)}else this.err(t("wrongPin"))}
    }else if(this.mode==="new1"){this.first=this.pin;this.mode="new2";this.pad(t("confirmPin"),"",canCancel)}
    else if(this.mode==="new2"){
      if(this.pin!==this.first){this.mode="new1";this.pad(t("setPin"),"",canCancel);return this.err(t("pinMismatch"))}
      S.sec=S.sec||{after:60};S.sec.salt=S.sec.salt||uid();S.sec.pin=await hash(this.pin,S.sec.salt);save();
      if(!S.sec.ans)this.question(true);else{this.hide();toast(t("pinOk"));render()}}
  },
  newPin(firstTime){this.mode="new1";this.pad(firstTime?t("setPin"):t("newPin"),firstTime?t("welcome"):"",!firstTime)},
  question(forced){const cur=S.sec?.q??0;
    this.show(`<div class="logo">🛟</div><h2>${t("secQ")}</h2><p>${t("secHelp")}</p>
    <div class="box"><label>${t("secQ")}</label><select id="sq">${t("qs").map((q,i)=>`<option value="${i}" ${i===cur?"selected":""}>${esc(q)}</option>`).join("")}</select>
    <label>${t("secA")}</label><input id="sa" autocomplete="off">
    <button class="btn" id="sqSave">${t("save")}</button>${forced?"":`<button class="llink" id="sqCancel" style="width:100%">${t("cancel")}</button>`}</div>`);
    if(!forced)$("#sqCancel").onclick=()=>this.hide();
    $("#sqSave").onclick=async()=>{const a=norm($("#sa").value);if(!a)return $("#sa").focus();
      S.sec.q=+$("#sq").value;S.sec.ans=await hash(a,S.sec.salt);save();this.hide();toast(t("saved"));render()}},
  forgot(){
    this.show(`<div class="logo">🛟</div><h2>${t("forgot")}</h2>
    <div class="box"><label>${esc(t("qs")[S.sec.q]||"")}</label><input id="fa" autocomplete="off"><div class="lerr" id="lerr" style="margin-top:8px"></div>
    <button class="btn" id="faOk">${t("next")}</button><button class="llink" id="faBack" style="width:100%">${t("back")}</button></div>`);
    $("#faBack").onclick=()=>this.lock();
    $("#faOk").onclick=async()=>{if(Date.now()<this.until){$("#lerr").textContent=`${t("tooMany")} ${Math.ceil((this.until-Date.now())/1000)} ${t("sec")}`;return}
      if(await hash(norm($("#fa").value),S.sec.salt)===S.sec.ans){this.mode="new1";this.pad(t("newPin"),"",false)}
      else{this.fails++;if(this.fails>=5){this.until=Date.now()+30000;this.fails=0}$("#lerr").textContent=t("wrongAns")}}},
  lock(){if(!S.sec?.pin)return;closeSheet();this.mode="unlock";this.pad(t("enterPin"),"",false)},
  start(){if(!S.sec?.pin)this.newPin(true);else if(!S.sec.ans)this.question(true);else this.lock()}
};
document.addEventListener("visibilitychange",()=>{
  if(document.hidden)Lock.hiddenAt=Date.now();
  else if(S.sec?.pin&&!Lock.el.classList.contains("show")&&Date.now()-Lock.hiddenAt>=(S.sec.after??60)*1000)Lock.lock()});


/* ===== events ===== */
document.querySelector("nav.tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;V.tab=b.dataset.tab;render();scrollTo(0,0)};
$("#mPrev").onclick=()=>{V.month=shiftM(V.month,-1);render()};
$("#mNext").onclick=()=>{V.month=shiftM(V.month,1);render()};
$("#setBtn").onclick=settings;
$("#fab").onclick=()=>{if(!S.members.length&&V.tab!=="mem"){V.tab="mem";render()}
  ({meal:()=>{V.mealDate=defDate();rMeal()},exp:()=>V.expTab==="bazar"?bazarForm():billForm(),dep:()=>depForm(),mem:()=>memberForm()})[V.tab]()};
app.addEventListener("click",e=>{const r=e.target.closest("[data-st]");if(r)statement(r.dataset.st)});
render();
Lock.start();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
